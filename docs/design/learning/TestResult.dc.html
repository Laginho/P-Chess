<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pass test: result</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 32px 40px 40px; display: flex; flex-direction: column; gap: 24px; background: #1f1e1c; color: #ece9e4; font-family: 'Noto Sans', system-ui, sans-serif">
  <div style="display: flex; align-items: center; gap: 16px">
    <a href="Unit.dc.html" aria-label="Back to the unit" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #2b2a27; border: 1px solid #45423d; border-radius: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #a8a49c">Rook endgames · Part 4</span>
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; line-height: 1.15">Pass test</h1>
    </div>
  </div>

  <div style="flex: 1 1 0; min-height: 0; display: flex; justify-content: center">
    <div style="width: 960px; display: flex; flex-direction: column; gap: 18px">
      <div style="padding: 20px 24px; display: flex; align-items: center; gap: 18px; background: {{v.bannerBg}}; border-radius: 10px">
        <span style="width: 56px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 28px; background: {{v.iconBg}}">
          <sc-if value="{{v.ok}}" hint-placeholder-val="{{ false }}">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="#141412" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6-4.9-4.6 6.6-.8z"></path></svg>
          </sc-if>
          <sc-if value="{{v.bad}}" hint-placeholder-val="{{ true }}">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"></path><path d="M3.5 4v4h4"></path></svg>
          </sc-if>
        </span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 26px; font-weight: 800; color: {{v.titleColor}}">{{v.title}}</span>
          <span style="font-size: 15px; color: #ece9e4">{{v.sub}}</span>
        </div>
      </div>

      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #a8a49c">Positions</span>
        <span style="font-size: 15px; font-weight: 700">{{v.posScore}}</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{v.tiles}}" as="t" hint-placeholder-count="6">
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 8px; background: #2b2a27; border: {{t.border}}; border-radius: 8px">
            <dc-import name="Board" fen="{{t.fen}}" size="134" coords="false" marks="" hint-size="134px,134px"></dc-import>
            <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; color: {{t.color}}">
              <span>{{t.mark}}</span><span>{{t.label}}</span>
            </div>
            <sc-if value="{{t.miss}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-direction: column; gap: 2px; font-size: 13px">
                <span><span style="color: #a8a49c">You </span><span style="font-weight: 700; color: #ee7a72">{{t.you}}</span></span>
                <span><span style="color: #a8a49c">Best </span><span style="font-weight: 700; color: #98bc49">{{t.best}}</span></span>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #a8a49c">Play-outs against a perfect opponent</span>
        <span style="font-size: 15px; font-weight: 700">{{v.poScore}}</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{v.playouts}}" as="p" hint-placeholder-count="2">
          <div style="height: 64px; padding: 0 18px; display: flex; align-items: center; gap: 12px; background: #2b2a27; border: {{p.border}}; border-radius: 8px">
            <span style="font-size: 18px; font-weight: 800; color: {{p.color}}">{{p.mark}}</span>
            <span style="font-size: 17px; font-weight: 800">{{p.name}}</span>
            <span style="margin-left: auto; font-size: 14px; color: #a8a49c">{{p.note}}</span>
          </div>
        </sc-for>
      </div>

      <div style="margin-top: auto; display: flex; justify-content: flex-end; gap: 12px">
        <a href="{{v.secondHref}}" style="height: 56px; padding: 0 24px; display: flex; align-items: center; background: #2b2a27; border: 1px solid #45423d; border-radius: 10px; font-size: 16px; font-weight: 700">{{v.second}}</a>
        <a href="{{v.primaryHref}}" style="height: 56px; padding: 0 28px; display: flex; align-items: center; background: #7fa650; color: #141412; border-radius: 10px; font-size: 18px; font-weight: 800">{{v.primary}}</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result":{"editor":"enum","options":["passed","not passed"],"default":"not passed"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const passed = this.props.result === 'passed';
    const fens = [
      '1K1k4/1P6/8/8/8/8/r7/2R5', '8/8/8/8/4pk2/R7/7r/4K3', '2K1k3/2P5/8/8/8/8/1r6/3R4',
      '8/8/8/8/3pk3/R7/6r1/3K4', '3K1k2/3P4/8/8/8/8/2r5/4R3', '8/8/8/8/2pk4/7R/1r6/2K5'
    ];
    const ok = (fen, i) => ({ fen, mark: '✓', label: 'Position ' + (i + 1), color: '#98bc49', border: '1px solid #45423d', miss: false, you: '', best: '' });
    const no = (fen, i, you, best) => ({ fen, mark: '✗', label: 'Position ' + (i + 1), color: '#ee7a72', border: '1px solid #8a3a38', miss: true, you, best });
    const v = passed ? {
      ok: true, bad: false, bannerBg: '#2c3a21', iconBg: '#7fa650', titleColor: '#b9d68f',
      title: 'Unit mastered', sub: 'A 3-position review check comes back in 7 days, then in 30.',
      posScore: '5 of 6 first try', poScore: '2 of 2',
      tiles: fens.map((f, i) => i === 3 ? no(f, i, '1. Ra8', '1. Rb3') : ok(f, i)),
      playouts: [
        { mark: '✓', color: '#98bc49', border: '1px solid #45423d', name: 'Convert', note: 'Promoted on move 11' },
        { mark: '✓', color: '#98bc49', border: '1px solid #45423d', name: 'Hold', note: 'Won the pawn on move 17' }
      ],
      second: 'Home', secondHref: 'Main.dc.html', primary: 'Back to the unit', primaryHref: 'Unit.dc.html'
    } : {
      ok: false, bad: true, bannerBg: '#2b2a27', iconBg: '#45423d', titleColor: '#ece9e4',
      title: 'Not passed yet', sub: '4 of 6 first try, you need 5. Retry with fresh positions any time.',
      posScore: '4 of 6 first try', poScore: '1 of 2',
      tiles: fens.map((f, i) => i === 2 ? no(f, i, '1. Rd2', '1. Re1+') : i === 3 ? no(f, i, '1. Ra8', '1. Rb3') : ok(f, i)),
      playouts: [
        { mark: '✓', color: '#98bc49', border: '1px solid #45423d', name: 'Convert', note: 'Promoted on move 11' },
        { mark: '✗', color: '#ee7a72', border: '1px solid #8a3a38', name: 'Hold', note: 'Lost the draw with 9. Rh8' }
      ],
      second: 'Back to the unit', secondHref: 'Unit.dc.html', primary: 'Retry with new positions', primaryHref: 'TestStart.dc.html'
    };
    return { v };
  }
}
</script>
</body>
</html>
