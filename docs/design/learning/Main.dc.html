<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P-Chess home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 40px; display: flex; gap: 48px; background: #1f1e1c; color: #ece9e4; font-family: 'Noto Sans', system-ui, sans-serif">
  <dc-import name="Board" fen="{{boardFen}}" size="720" marks="" hint-size="720px,720px"></dc-import>
  <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -0.5px; text-align: center">P-Chess</h1>

    <a href="{{cont.href}}" aria-label="{{cont.aria}}" style="position: relative; height: 176px; box-sizing: border-box; padding: 20px 64px 20px 22px; display: flex; flex-direction: column; justify-content: center; gap: 6px; background: {{cont.bg}}; color: {{cont.fg}}; border: {{cont.border}}; border-radius: 10px; cursor: pointer">
      <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; opacity: 0.8">{{cont.eyebrow}}</span>
      <span style="font-size: 28px; font-weight: 800; line-height: 1.15">{{cont.title}}</span>
      <span style="font-size: 16px; font-weight: 600">{{cont.sub}}</span>
      <sc-if value="{{cont.hasBar}}" hint-placeholder-val="{{ true }}">
        <div style="margin-top: 8px; height: 6px; border-radius: 3px; background: rgba(20, 20, 18, 0.22); overflow: hidden">
          <div style="width: {{cont.bar}}; height: 100%; background: #141412; border-radius: 3px"></div>
        </div>
      </sc-if>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 22px; top: 50%; margin-top: -15px"><path d="M9 5l7 7-7 7"></path></svg>
    </a>

    <a href="CourseMap.dc.html" style="height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #363430; border: 1px solid #45423d; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"></path><path d="M9 3v15M15 6v15"></path></svg>
      Course
      <span style="margin-left: auto; font-size: 14px; font-weight: 600; color: #a8a49c">1 unit · in progress</span>
    </a>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 14px">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #a8a49c">Play</span>
      <button aria-label="Maia level: Maia 1500" style="height: 36px; padding: 0 10px 0 12px; display: flex; align-items: center; gap: 8px; background: #2b2a27; color: #ece9e4; border: 1px solid #45423d; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7fa650" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="3"></rect><circle cx="9" cy="11" r="1.4"></circle><circle cx="15" cy="11" r="1.4"></circle><path d="M9 15.5h6"></path><path d="M12 5V2.5"></path></svg>
        Maia 1500
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a8a49c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
      <button aria-label="1+0 Bullet" style="height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: #363430; color: #ece9e4; border: 1px solid #45423d; border-radius: 10px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(45 12 12)"><path d="M9 21.5V10c0-4.2 3-7.5 3-7.5s3 3.3 3 7.5v11.5z" fill="#7fa650"></path></g></svg>
        <span style="font-size: 22px; font-weight: 800; line-height: 1">1+0</span>
      </button>
      <button aria-label="3+2 Blitz" style="height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: #363430; color: #ece9e4; border: 1px solid #45423d; border-radius: 10px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#f4bf44" aria-hidden="true"><path d="M13.5 2L5 13.5h6L9.5 22 19 9.5h-6.2z"></path></svg>
        <span style="font-size: 22px; font-weight: 800; line-height: 1">3+2</span>
      </button>
      <button aria-label="5+0 Blitz" style="height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: #363430; color: #ece9e4; border: 1px solid #45423d; border-radius: 10px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#f4bf44" aria-hidden="true"><path d="M13.5 2L5 13.5h6L9.5 22 19 9.5h-6.2z"></path></svg>
        <span style="font-size: 22px; font-weight: 800; line-height: 1">5+0</span>
      </button>
      <button aria-label="Custom game" style="height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: #2b2a27; color: #ece9e4; border: 1px solid #45423d; border-radius: 10px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
        <span style="font-size: 15px; font-weight: 700; line-height: 1">Custom</span>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: auto">
      <button style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #2b2a27; color: #ece9e4; border: 1px solid #45423d; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"></path><path d="M3.5 4v4h4"></path><path d="M12 8v4l3 2"></path></svg>
        History
      </button>
      <a href="Profile.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #2b2a27; color: #ece9e4; border: 1px solid #45423d; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"></path></svg>
        Profile
      </a>
      <button style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #2b2a27; color: #ece9e4; border: 1px solid #45423d; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
        Settings
      </button>
      <button style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #2b2a27; color: #ece9e4; border: 1px solid #45423d; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9"></path><path d="M6.5 6.5a8 8 0 1 0 11 0"></path></svg>
        Quit
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"continueState":{"editor":"enum","options":["part","review","game","done"],"default":"part"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const green = { bg: '#7fa650', fg: '#141412', border: '0' };
    const states = {
      part: { ...green, eyebrow: 'Continue', title: 'Rook endgames', sub: 'Solving · 4/12', hasBar: true, bar: '33%', href: 'SolvingEntry.dc.html', aria: 'Continue: Rook endgames, solving 4/12', fen: '1K1k4/1P6/8/8/8/8/r7/2R5' },
      review: { ...green, eyebrow: 'Review check', title: 'Rook endgames', sub: '3 positions · mastered 7 days ago', hasBar: false, bar: '0%', href: 'SolvingEntry.dc.html', aria: 'Review check: Rook endgames, 3 positions', fen: '8/8/8/8/4pk2/R7/7r/4K3' },
      game: { ...green, eyebrow: 'From your game', title: 'Rook endgames', sub: '1 new position from your games', hasBar: false, bar: '0%', href: 'SolvingEntry.dc.html', aria: 'From your game: Rook endgames, 1 new position', fen: '8/8/8/8/4pk2/R7/7r/4K3' },
      done: { bg: '#2b2a27', fg: '#ece9e4', border: '1px solid #45423d', eyebrow: 'Unit done', title: 'Go play some slow games', sub: 'Custom game, or the quick play below', hasBar: false, bar: '0%', href: 'CourseMap.dc.html', aria: 'Unit done, go play some slow games', fen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR' }
    };
    const cont = states[this.props.continueState ?? 'part'] || states.part;
    return { cont, boardFen: cont.fen };
  }
}
</script>
</body>
</html>
