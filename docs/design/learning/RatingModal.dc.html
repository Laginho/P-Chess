<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rating sentence dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
button,input,select{font-family:inherit}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; font-family: 'Noto Sans', system-ui, sans-serif">
  <dc-import name="CourseMap" hint-size="1280px,800px"></dc-import>
  <div style="position: absolute; inset: 0; background: rgba(10, 10, 9, 0.72); display: flex; align-items: center; justify-content: center">
    <div role="dialog" aria-modal="true" aria-labelledby="rating-title" style="width: 560px; box-sizing: border-box; padding: 28px; display: flex; flex-direction: column; gap: 22px; background: #2b2a27; border: 1px solid #45423d; border-radius: 12px; color: #ece9e4">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h2 id="rating-title" style="margin: 0; font-size: 22px; font-weight: 800">Where are you now?</h2>
        <p style="margin: 0; font-size: 14px; color: #a8a49c">Your rating picks your stage and how strong Maia plays. You can change it in Profile.</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 20px; font-weight: 700">
        <span>I’m rated</span>
        <label for="rating-value" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rating</label>
        <input id="rating-value" type="text" inputmode="numeric" value="{{rating}}" onChange="{{setRating}}" style="width: 96px; height: 48px; box-sizing: border-box; padding: 0 12px; background: #1f1e1c; color: #ece9e4; border: 2px solid #7fa650; border-radius: 8px; font-size: 20px; font-weight: 800; text-align: center; outline: none">
        <span>in rapid on</span>
        <label for="rating-site" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Site</label>
        <select id="rating-site" onChange="{{setSite}}" style="height: 48px; padding: 0 12px; background: #1f1e1c; color: #ece9e4; border: 1px solid #45423d; border-radius: 8px; font-size: 18px; font-weight: 700; cursor: pointer">
          <option value="chess.com">chess.com</option>
          <option value="lichess">lichess</option>
        </select>
      </div>
      <sc-if value="{{showConverted}}" hint-placeholder-val="{{ false }}">
        <span style="margin-top: -10px; font-size: 14px; color: #a8a49c">Shown as {{converted}} on the chess.com scale.</span>
      </sc-if>
      <a href="CourseMap.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; background: #7fa650; color: #141412; border-radius: 8px; font-size: 16px; font-weight: 800">Start the course</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const rating = s.rating ?? '1600';
    const lichess = s.site === 'lichess';
    const n = parseInt(rating, 10);
    return {
      rating,
      showConverted: lichess && !isNaN(n),
      converted: isNaN(n) ? '' : String(n - 300),
      setRating: (e) => this.setState({ rating: e.target.value }),
      setSite: (e) => this.setState({ site: e.target.value })
    };
  }
}
</script>
</body>
</html>
