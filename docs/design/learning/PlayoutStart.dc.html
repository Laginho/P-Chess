<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Play-out: start</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 40px; display: flex; gap: 40px; background: #1f1e1c; color: #ece9e4; font-family: 'Noto Sans', system-ui, sans-serif">
  <dc-import name="Board" fen="{{v.fen}}" size="720" marks="" hint-size="720px,720px"></dc-import>

  <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Unit.dc.html" aria-label="Back to the unit" style="width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; background: #2b2a27; border: 1px solid #45423d; border-radius: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #a8a49c">Rook endgames · Play-outs</span>
        <span style="font-size: 20px; font-weight: 800">{{v.counter}}</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{v.pills}}" as="p" hint-placeholder-count="4">
        <div style="height: 34px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 6px; background: {{p.bg}}; color: {{p.fg}}; box-shadow: {{p.ring}}; font-size: 13px; font-weight: 700">{{p.label}}</div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 18px; background: #2b2a27; border: 1px solid #45423d; border-radius: 10px">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #a8a49c">{{v.kind}}</span>
      <div style="display: flex; align-items: center; gap: 10px">
        <span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 4px; background: #ece9e4; border: 1px solid #a8a49c"></span>
        <span style="font-size: 22px; font-weight: 800">{{v.task}}</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: #2b2a27; border: 1px solid #45423d; border-radius: 10px">
      <div style="width: 44px; height: 44px; border-radius: 8px; background: #5a5650; display: flex; align-items: center; justify-content: center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="6" width="16" height="13" rx="3"></rect><circle cx="9" cy="12" r="1.3"></circle><circle cx="15" cy="12" r="1.3"></circle><path d="M12 6V3"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 17px; font-weight: 700">Maia 1900</span>
        <span style="font-size: 13px; color: #a8a49c">Plays like a 1600 chess.com player</span>
      </div>
      <span style="margin-left: auto; height: 36px; padding: 0 12px; display: flex; align-items: center; gap: 8px; background: #1f1e1c; border: 1px solid #45423d; border-radius: 6px; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a49c" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M10 2h4"></path></svg>
        5+5
      </span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 18px; background: #2b2a27; border: 1px solid #45423d; border-radius: 10px; font-size: 15px">
      <div style="display: flex; gap: 10px"><span style="width: 44px; flex: none; font-weight: 800; color: #98bc49">Pass</span><span>{{v.pass}}</span></div>
      <div style="display: flex; gap: 10px"><span style="width: 44px; flex: none; font-weight: 800; color: #ee7a72">Fail</span><span>A move that changes the result, or running out of time</span></div>
    </div>

    <a href="PlayoutEnd.dc.html" style="margin-top: auto; height: 56px; display: flex; align-items: center; justify-content: center; background: #7fa650; color: #141412; border-radius: 10px; font-size: 18px; font-weight: 800">Start</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["convert","hold"],"default":"convert"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const hold = this.props.kind === 'hold';
    const pill = (label, state) => ({
      label,
      bg: state === 'passed' ? '#7fa650' : state === 'current' ? '#363430' : '#2b2a27',
      fg: state === 'passed' ? '#141412' : state === 'current' ? '#ece9e4' : '#a8a49c',
      ring: state === 'current' ? 'inset 0 0 0 2px #ece9e4' : 'inset 0 0 0 1px #45423d'
    });
    const v = hold ? {
      fen: '8/8/8/8/4pk2/R7/7r/4K3', counter: 'Play-out 3 of 4', kind: 'Hold',
      task: 'White to play and draw', pass: 'Win the pawn, or hold for 30 moves',
      pills: [pill('Convert ✓', 'passed'), pill('Convert ✓', 'passed'), pill('Hold', 'current'), pill('Hold', 'todo')]
    } : {
      fen: '1K1k4/1P6/8/8/8/8/r7/2R5', counter: 'Play-out 1 of 4', kind: 'Convert',
      task: 'White to play and win', pass: 'Promote the pawn or give mate',
      pills: [pill('Convert', 'current'), pill('Convert', 'todo'), pill('Hold', 'todo'), pill('Hold', 'todo')]
    };
    return { v };
  }
}
</script>
</body>
</html>
