<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Searching for a game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
.spinner{animation:spin 1.4s linear infinite;will-change:transform}
.spinner-arc{stroke-dasharray:1 252;stroke-dashoffset:0;animation:arc 1.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes arc{0%{stroke-dasharray:1 252;stroke-dashoffset:0}50%{stroke-dasharray:150 252;stroke-dashoffset:-30}100%{stroke-dasharray:1 252;stroke-dashoffset:-250}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}.spinner-arc{animation:none;stroke-dasharray:90 252}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 40px; display: flex; gap: 40px; background: #1f1e1c; color: #ece9e4; font-family: 'Noto Sans', system-ui, sans-serif">
  <dc-import name="Board" fen="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR" size="720" hint-size="720px,720px"></dc-import>
  <div style="width: 440px; height: 720px; box-sizing: border-box; display: flex; flex-direction: column; background: #2b2a27; border: 1px solid #45423d; border-radius: 10px; overflow: hidden">
    <div style="height: 64px; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #45423d">
      <div style="width: 36px; height: 36px; border-radius: 6px; background: #5a5650; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="6" width="16" height="13" rx="3"></rect><circle cx="9" cy="12" r="1.3"></circle><circle cx="15" cy="12" r="1.3"></circle><path d="M12 6V3"></path></svg>
      </div>
      <span style="font-size: 15px; font-weight: 700; color: #a8a49c">Opponent</span>
    </div>
    <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 32px">
      <svg class="spinner" width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
        <circle class="spinner-arc" cx="48" cy="48" r="40" fill="none" stroke="#7fa650" stroke-width="8" stroke-linecap="round"></circle>
      </svg>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <h2 style="margin: 0; font-size: 24px; font-weight: 800">Starting your game</h2>
        <p role="status" style="margin: 0; font-size: 15px; color: #a8a49c">Loading model…</p>
      </div>
      <div style="display: flex; gap: 10px">
        <span style="height: 36px; padding: 0 14px; display: flex; align-items: center; gap: 8px; background: #363430; border-radius: 18px; font-size: 14px; font-weight: 700">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#7fa650" aria-hidden="true"><path d="M13.5 2L5 13.5h6L9.5 22 19 9.5h-6.2z"></path></svg>
          3+2 Blitz
        </span>
        <span style="height: 36px; padding: 0 14px; display: flex; align-items: center; gap: 8px; background: #363430; border-radius: 18px; font-size: 14px; font-weight: 700">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7fa650" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="6" width="16" height="13" rx="3"></rect><circle cx="9" cy="12" r="1.3"></circle><circle cx="15" cy="12" r="1.3"></circle><path d="M12 6V3"></path></svg>
          Maia 1500
        </span>
      </div>
    </div>
    <div style="height: 64px; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #45423d">
      <div style="width: 36px; height: 36px; border-radius: 6px; background: #7fa650; color: #141412; display: flex; align-items: center; justify-content: center; font-weight: 800">B</div>
      <span style="font-size: 15px; font-weight: 700">Bruno</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
