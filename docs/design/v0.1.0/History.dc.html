<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; background: #1f1e1c; color: #ece9e4; font-family: 'Noto Sans', system-ui, sans-serif">
  <div style="height: 48px; display: flex; align-items: center; gap: 16px">
    <button aria-label="Back to home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid #45423d; border-radius: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <h1 style="margin: 0; font-size: 26px; font-weight: 800">History</h1>
    <div role="tablist" aria-label="Time control" style="margin-left: 24px; display: flex; gap: 4px; padding: 4px; background: #2b2a27; border-radius: 8px">
      <button role="tab" aria-selected="true" style="height: 36px; padding: 0 16px; background: #45423d; color: #ece9e4; border: 0; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer">All <span style="color: #a8a49c; font-weight: 600">128</span></button>
      <button role="tab" aria-selected="false" style="height: 36px; padding: 0 16px; background: transparent; color: #ece9e4; border: 0; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer">1+0 <span style="color: #a8a49c">41</span></button>
      <button role="tab" aria-selected="false" style="height: 36px; padding: 0 16px; background: transparent; color: #ece9e4; border: 0; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer">3+2 <span style="color: #a8a49c">62</span></button>
      <button role="tab" aria-selected="false" style="height: 36px; padding: 0 16px; background: transparent; color: #ece9e4; border: 0; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer">5+0 <span style="color: #a8a49c">25</span></button>
    </div>
  </div>
  <div style="height: 44px; display: flex; align-items: center; gap: 12px">
    <label style="height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 14px; color: #a8a49c; cursor: pointer">
      <input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #7fa650">
      2 selected
    </label>
    <button style="height: 40px; padding: 0 16px; display: flex; align-items: center; gap: 8px; background: #7fa650; color: #141412; border: 0; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141412" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 4 8-9"></path></svg>
      Analyze selected
    </button>
    <p role="status" style="margin: 0 0 0 auto; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #a8a49c">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#45423d" stroke-width="3"></circle><path d="M12 3a9 9 0 0 1 9 9" fill="none" stroke="#7fa650" stroke-width="3" stroke-linecap="round"></path></svg>
      Analysing 2 of 7 · Background
    </p>
    <button style="height: 40px; padding: 0 16px; background: #363430; color: #ece9e4; border: 1px solid #45423d; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer">Analyze all in “All”</button>
  </div>
  <ul aria-label="Games" style="flex: 1 1 0; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <sc-for list="{{games}}" as="g" hint-placeholder-count="6">
      <li style="height: 96px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 14px 0 4px; background: #2b2a27; border: 1px solid {{g.border}}; border-radius: 10px">
        <label style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <input type="checkbox" aria-label="Select game" checked="{{g.checked}}" readOnly="{{ true }}" style="width: 18px; height: 18px; margin: 0; accent-color: #7fa650">
        </label>
        <dc-import name="Board" fen="{{g.fen}}" last="{{g.last}}" flipped="{{g.flipped}}" size="80" coords="false" hint-size="80px,80px"></dc-import>
        <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <sc-if value="{{g.hasOpening}}" hint-placeholder-val="{{ true }}">
            <span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.opening}}</span>
          </sc-if>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 14px">
            <span aria-label="{{g.meColour}}" style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: {{g.meSwatch}}; border: 1px solid #8c887f"></span>
            <span style="font-weight: 600">Bruno</span>
            <span style="color: #a8a49c">x</span>
            <span aria-label="{{g.botColour}}" style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: {{g.botSwatch}}; border: 1px solid #8c887f"></span>
            <span style="font-weight: 600">{{g.bot}}</span>
          </span>
          <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #a8a49c">
            <span>{{g.date}}</span><span>·</span>
            <span style="padding: 1px 6px; border: 1px solid #45423d; border-radius: 4px; font-weight: 600">{{g.tc}}</span><span>·</span>
            <span style="font-weight: 700; color: {{g.resultColor}}">{{g.result}}</span><span>·</span>
            <span>{{g.moves}} moves</span>
          </span>
        </div>
        <div style="width: 232px; flex: none; display: flex; flex-direction: column; gap: 6px">
          <sc-if value="{{g.isAnalysed}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 12px; color: #a8a49c">Accuracy</span>
            <div style="display: flex; gap: 6px; opacity: {{g.accOpacity}}">
              <span style="height: 32px; flex: 1 1 0; display: flex; align-items: center; justify-content: center; background: {{g.meAccBg}}; color: {{g.meAccFg}}; border: 1px solid #6b675f; border-radius: 6px; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums">{{g.meAcc}}</span>
              <span style="height: 32px; flex: 1 1 0; display: flex; align-items: center; justify-content: center; background: {{g.botAccBg}}; color: {{g.botAccFg}}; border: 1px solid #6b675f; border-radius: 6px; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums">{{g.botAcc}}</span>
            </div>
          </sc-if>
          <sc-if value="{{g.isStale}}" hint-placeholder-val="{{ false }}">
            <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #f4bf44">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f4bf44" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v4M12 17.5v.5"></path></svg>
              Stale: engine settings changed
            </span>
          </sc-if>
          <sc-if value="{{g.isAnalysing}}" hint-placeholder-val="{{ false }}">
            <span style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">Analysing…</span><span style="font-weight: 700; font-variant-numeric: tabular-nums">46%</span></span>
            <div role="progressbar" aria-valuenow="46" aria-valuemin="0" aria-valuemax="100" aria-label="Analysis progress" style="height: 8px; background: #1f1e1c; border-radius: 4px; overflow: hidden">
              <div style="width: 46%; height: 100%; background: #7fa650"></div>
            </div>
          </sc-if>
          <sc-if value="{{g.isQueued}}" hint-placeholder-val="{{ false }}">
            <span style="align-self: flex-start; height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: #363430; border-radius: 14px; font-size: 13px; font-weight: 600">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a8a49c" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
              Queued · 3rd in line
            </span>
          </sc-if>
          <sc-if value="{{g.isNone}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 13px; color: #a8a49c">Not analysed</span>
          </sc-if>
        </div>
        <sc-if value="{{g.isDeleting}}" hint-placeholder-val="{{ false }}">
          <div role="alertdialog" aria-label="Delete game" style="width: 330px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 8px">
            <span style="font-size: 14px; font-weight: 600; margin-right: 4px">Delete this game?</span>
            <button style="height: 40px; padding: 0 14px; background: #c93230; color: #ffffff; border: 0; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer">Delete</button>
            <button style="height: 40px; padding: 0 14px; background: #363430; color: #ece9e4; border: 1px solid #45423d; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer">Cancel</button>
          </div>
        </sc-if>
        <sc-if value="{{g.notDeleting}}" hint-placeholder-val="{{ true }}">
          <div style="width: 330px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 8px">
            <button style="height: 40px; padding: 0 16px; background: {{g.reviewBg}}; color: {{g.reviewFg}}; border: 0; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer">Review</button>
            <button disabled="{{g.analyzeDisabled}}" style="height: 40px; padding: 0 14px; background: #363430; color: {{g.analyzeFg}}; border: 1px solid #45423d; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer">{{g.analyzeLabel}}</button>
            <button aria-label="Copy PGN" title="Copy PGN" style="width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid #45423d; border-radius: 8px; cursor: pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a8a49c" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"></path></svg>
            </button>
            <button aria-label="Delete game" title="Delete game" style="width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid #45423d; border-radius: 8px; cursor: pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a8a49c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 7V4.5h4V7M6.5 7l1 13h9l1-13"></path></svg>
            </button>
          </div>
        </sc-if>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const WIN = '#8fbc5a', LOSS = '#ee7a72', DRAW = '#a8a49c';
    const rows = [
      { state: 'analysed', opening: 'Caro-Kann Defense: Advance Variation', fen: 'rnbqkbnr/pp2pppp/2p5/3pP3/3P4/8/PPP2PPP/RNBQKBNR', last: 'e4e5', black: false, bot: 'Maia 1500', date: 'Today, 14:32', tc: '3+2', result: 'Won on time', rc: WIN, moves: 41, me: '86.4', them: '78.1' },
      { state: 'analysing', opening: 'Italian Game: Giuoco Piano', fen: 'r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R', last: 'f8c5', black: true, bot: 'Maia 1500', date: 'Today, 14:05', tc: '1+0', result: 'Lost by checkmate', rc: LOSS, moves: 28 },
      { state: 'queued', checked: true, opening: 'Sicilian Defense: Najdorf Variation', fen: 'rnbqkb1r/1p2pppp/p2p1n2/8/3NP3/2N5/PPP2PPP/R1BQKB1R', last: 'a7a6', black: false, bot: 'Maia 1700', date: 'Yesterday, 22:48', tc: '5+0', result: 'Draw by agreement', rc: DRAW, moves: 52 },
      { state: 'stale', checked: true, opening: 'Queen’s Gambit Declined', fen: 'rnbqkbnr/ppp2ppp/4p3/3p4/2PP4/8/PP2PPPP/RNBQKBNR', last: 'e7e6', black: true, bot: 'Maia 1300', date: 'Oct 26, 2026', tc: '3+2', result: 'Won by resignation', rc: WIN, moves: 37, me: '81.0', them: '74.3' },
      { state: 'none', opening: '', fen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR', last: '', black: false, bot: 'Maia 1900', date: 'Oct 25, 2026', tc: '1+0', result: 'Lost on time', rc: LOSS, moves: 19 },
      { state: 'analysed', deleting: true, opening: 'Scandinavian Defense', fen: 'rnbqkbnr/ppp1pppp/8/3p4/4P3/8/PPPP1PPP/RNBQKBNR', last: 'd7d5', black: false, bot: 'Maia 1100', date: 'Oct 24, 2026', tc: '3+2', result: 'Won by checkmate', rc: WIN, moves: 23, me: '91.2', them: '62.8' }
    ];
    const games = rows.map((r) => {
      const analysedLike = r.state === 'analysed' || r.state === 'stale';
      const meWhite = !r.black;
      return {
        ...r,
        border: r.checked ? '#7fa650' : '#45423d',
        checked: !!r.checked,
        flipped: r.black,
        hasOpening: !!r.opening,
        meColour: meWhite ? 'White' : 'Black', botColour: meWhite ? 'Black' : 'White',
        meSwatch: meWhite ? '#ece9e4' : '#141412', botSwatch: meWhite ? '#141412' : '#ece9e4',
        resultColor: r.rc,
        isAnalysed: analysedLike, isStale: r.state === 'stale', isAnalysing: r.state === 'analysing',
        isQueued: r.state === 'queued', isNone: r.state === 'none',
        accOpacity: r.state === 'stale' ? '0.5' : '1',
        meAcc: r.me || '', botAcc: r.them || '',
        meAccBg: meWhite ? '#ece9e4' : '#141412', meAccFg: meWhite ? '#141412' : '#ece9e4',
        botAccBg: meWhite ? '#141412' : '#ece9e4', botAccFg: meWhite ? '#ece9e4' : '#141412',
        isDeleting: !!r.deleting, notDeleting: !r.deleting,
        reviewBg: analysedLike ? '#7fa650' : '#363430', reviewFg: analysedLike ? '#141412' : '#ece9e4',
        analyzeLabel: { analysed: 'Re-analyze', stale: 'Re-analyze', analysing: 'Analysing…', queued: 'Queued', none: 'Analyze' }[r.state],
        analyzeDisabled: r.state === 'analysing' || r.state === 'queued',
        analyzeFg: (r.state === 'analysing' || r.state === 'queued') ? '#8c887f' : (r.state === 'stale' ? '#f4bf44' : '#ece9e4')
      };
    });
    return { games };
  }
}
</script>
</body>
</html>
