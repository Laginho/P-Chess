<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Repertoires</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; background: #1f1e1c; color: #ece9e4; font-family: 'Noto Sans', system-ui, sans-serif">
  <div style="height: 48px; display: flex; align-items: center; gap: 16px">
    <button aria-label="Back to home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid #45423d; border-radius: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <h1 style="margin: 0; font-size: 26px; font-weight: 800">Repertoires</h1>
    <div style="margin-left: auto; display: flex; gap: 10px">
      <button style="height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; background: #363430; color: #ece9e4; border: 1px solid #45423d; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
        Import PGN
      </button>
      <button style="height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; background: #7fa650; color: #141412; border: 0; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 5.2c3-1.2 6.2-1 9 1v13.6c-2.8-2-6-2.2-9-1z M12.5 6.2c2.8-2 6-2.2 9-1v13.6c-3-1.2-6.2-1-9 1z" fill="#141412"></path></svg>
        From openings
      </button>
    </div>
  </div>
  <div style="flex: 1 1 0; min-height: 0; display: flex; gap: 16px">
    <ul aria-label="Saved repertoires" style="width: 280px; flex: none; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{reps}}" as="r" hint-placeholder-count="4">
        <li style="padding: 12px 14px; display: flex; align-items: center; gap: 12px; background: {{r.bg}}; border: 1px solid {{r.border}}; border-radius: 10px">
          <span aria-label="{{r.colour}}" style="width: 16px; height: 16px; flex: none; box-sizing: border-box; border-radius: 50%; background: {{r.swatch}}; border: 1px solid #8c887f"></span>
          <span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 700">{{r.name}}</span>
            <span style="font-size: 12px; color: #a8a49c">{{r.meta}}</span>
          </span>
          <button aria-label="Edit repertoire" title="Edit" style="width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid #45423d; border-radius: 6px; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a49c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
          </button>
        </li>
      </sc-for>
    </ul>
    <div style="width: 300px; flex: none; display: flex; flex-direction: column; background: #2b2a27; border: 1px solid #45423d; border-radius: 10px; overflow: hidden">
      <div style="padding: 12px 14px; border-bottom: 1px solid #45423d; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 800">Caro-Kann</span>
        <span style="font-size: 12px; color: #a8a49c">As Black · 14 lines</span>
      </div>
      <ul aria-label="Lines" style="margin: 0; padding: 6px; list-style: none; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
        <sc-for list="{{lines}}" as="l" hint-placeholder-count="8">
          <li>
            <button style="width: 100%; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; text-align: left; background: {{l.bg}}; color: #ece9e4; border: 0; border-radius: 6px; cursor: pointer">
              <span style="font-size: 13px; font-weight: 700">{{l.name}}</span>
              <span style="font-size: 12px; color: #a8a49c">{{l.moves}}</span>
            </button>
          </li>
        </sc-for>
      </ul>
    </div>
    <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 12px">
      <dc-import name="Board" fen="rn1qkbnr/pp3ppp/4p3/2ppPb2/3P4/5N2/PPP1BPPP/RNBQK2R" last="c6c5" flipped="true" size="600" hint-size="600px,600px"></dc-import>
      <div style="width: 600px; display: flex; align-items: center; gap: 6px">
        <button aria-label="Previous move (Left arrow)" style="width: 56px; height: 40px; display: flex; align-items: center; justify-content: center; background: #363430; border: 0; border-radius: 6px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <button aria-label="Next move (Right arrow)" style="width: 56px; height: 40px; display: flex; align-items: center; justify-content: center; background: #363430; border: 0; border-radius: 6px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b675f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
        <span style="margin-left: 8px; font-size: 14px; color: #a8a49c">1.e4 c6 2.d4 d5 3.e5 Bf5 4.Nf3 e6 5.Be2 <strong style="color: #ece9e4; background: #4a4741; padding: 2px 6px; border-radius: 4px">c5</strong></span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const reps = [
      ['Caro-Kann', false, '14 lines · from openings', true],
      ['Italian Game', true, '9 lines · imported PGN'],
      ['Queen’s Gambit Declined', false, '6 lines · from openings'],
      ['London System', true, '5 lines · from openings']
    ].map(([name, white, meta, sel]) => ({
      name, meta, colour: white ? 'White' : 'Black', swatch: white ? '#ece9e4' : '#141412',
      bg: sel ? '#363430' : '#2b2a27', border: sel ? '#7fa650' : '#45423d'
    }));
    const lines = [
      ['Advance: Short Variation', '3.e5 Bf5 4.Nf3 e6 5.Be2 c5', true],
      ['Advance: Tal Variation', '3.e5 Bf5 4.h4 h5'],
      ['Advance: Bayonet Attack', '3.e5 Bf5 4.g4 Bd7'],
      ['Classical Variation', '3.Nc3 dxe4 4.Nxe4 Bf5'],
      ['Exchange Variation', '3.exd5 cxd5 4.Bd3 Nc6'],
      ['Panov Attack', '3.exd5 cxd5 4.c4 Nf6'],
      ['Two Knights Attack', '2.Nc3 d5 3.Nf3 Bg4'],
      ['Fantasy Variation', '3.f3 e6 4.Nc3 Bb4'],
      ['Accelerated Panov', '2.c4 d5 3.exd5 cxd5']
    ].map(([name, moves, sel]) => ({ name, moves, bg: sel ? '#4a4741' : 'transparent' }));
    return { reps, lines };
  }
}
</script>
</body>
</html>
