<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P-Chess home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 40px; display: flex; gap: 48px; background: #1f1e1c; color: #ece9e4; font-family: 'Noto Sans', system-ui, sans-serif">
  <dc-import name="Board" fen="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR" size="720" hint-size="720px,720px"></dc-import>
  <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding-top: 8px">
    <div style="display: flex; flex-direction: column; gap: 4px; text-align: center">
      <h1 style="margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -0.5px">P-Chess</h1>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 12px">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #a8a49c">Quick play</span>
      <button aria-label="Maia level: Maia 1500" style="height: 36px; padding: 0 10px 0 12px; display: flex; align-items: center; gap: 8px; background: #2b2a27; color: #ece9e4; border: 1px solid #45423d; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7fa650" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="3"></rect><circle cx="9" cy="11" r="1.4"></circle><circle cx="15" cy="11" r="1.4"></circle><path d="M9 15.5h6"></path><path d="M12 5V2.5"></path></svg>
        Maia 1500
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a8a49c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button aria-label="1+0 Bullet" style="position: relative; height: 160px; display: flex; align-items: center; justify-content: center; background: #7fa650; color: #141412; border: 0; border-radius: 10px; cursor: pointer">
        <svg width="34" height="34" viewBox="0 0 24 24" style="position: absolute; left: 20px" aria-hidden="true"><g transform="rotate(45 12 12)"><path d="M9 21.5V10c0-4.2 3-7.5 3-7.5s3 3.3 3 7.5v11.5z" fill="#141412"></path><path d="M9 17.5h6" stroke="#7fa650" stroke-width="1.6"></path></g></svg>
        <span style="font-size: 34px; font-weight: 800; line-height: 1">1+0</span>
      </button>
      <button aria-label="3+2 Blitz" style="position: relative; height: 160px; display: flex; align-items: center; justify-content: center; background: #7fa650; color: #141412; border: 0; border-radius: 10px; cursor: pointer">
        <svg width="34" height="34" viewBox="0 0 24 24" style="position: absolute; left: 20px" fill="#141412" aria-hidden="true"><path d="M13.5 2L5 13.5h6L9.5 22 19 9.5h-6.2z"></path></svg>
        <span style="font-size: 34px; font-weight: 800; line-height: 1">3+2</span>
      </button>
      <button aria-label="5+0 Blitz" style="position: relative; height: 160px; display: flex; align-items: center; justify-content: center; background: #7fa650; color: #141412; border: 0; border-radius: 10px; cursor: pointer">
        <svg width="34" height="34" viewBox="0 0 24 24" style="position: absolute; left: 20px" fill="#141412" aria-hidden="true"><path d="M13.5 2L5 13.5h6L9.5 22 19 9.5h-6.2z"></path></svg>
        <span style="font-size: 34px; font-weight: 800; line-height: 1">5+0</span>
      </button>
      <button aria-label="Custom game" style="position: relative; height: 160px; display: flex; align-items: center; justify-content: center; background: #363430; color: #ece9e4; border: 1px solid #45423d; border-radius: 10px; cursor: pointer">
        <svg width="30" height="30" viewBox="0 0 24 24" style="position: absolute; left: 22px" fill="none" stroke="#ece9e4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
        <span style="font-size: 24px; font-weight: 800; line-height: 1">Custom</span>
      </button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #2b2a27; color: #ece9e4; border: 1px solid #45423d; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"></path><path d="M3.5 4v4h4"></path><path d="M12 8v4l3 2"></path></svg>
          History
        </button>
        <button style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #2b2a27; color: #ece9e4; border: 1px solid #45423d; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"></path></svg>
          Profile
        </button>
        <button style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #2b2a27; color: #ece9e4; border: 1px solid #45423d; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.36 10.10 L21.82 10.09 L21.82 13.91 L19.36 13.90 L18.55 15.86 L20.29 17.59 L17.59 20.29 L15.86 18.55 L13.90 19.36 L13.91 21.82 L10.09 21.82 L10.10 19.36 L8.14 18.55 L6.41 20.29 L3.71 17.59 L5.45 15.86 L4.64 13.90 L2.18 13.91 L2.18 10.09 L4.64 10.10 L5.45 8.14 L3.71 6.41 L6.41 3.71 L8.14 5.45 L10.10 4.64 L10.09 2.18 L13.91 2.18 L13.90 4.64 L15.86 5.45 L17.59 3.71 L20.29 6.41 L18.55 8.14Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          Settings
        </button>
        <button style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #2b2a27; color: #ece9e4; border: 1px solid #45423d; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9"></path><path d="M6.5 6.5a8 8 0 1 0 11 0"></path></svg>
          Quit
        </button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
