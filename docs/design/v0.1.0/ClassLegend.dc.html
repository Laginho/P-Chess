<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Move classes and colours</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 720px; height: 560px; box-sizing: border-box; padding: 28px; display: flex; flex-direction: column; gap: 18px; background: #1f1e1c; color: #ece9e4; font-family: 'Noto Sans', system-ui, sans-serif">
  <h2 style="margin: 0; font-size: 20px; font-weight: 800">Move classes, best to worst</h2>
  <ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px">
    <sc-for list="{{items}}" as="c" hint-placeholder-count="12">
      <li style="height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: #2b2a27; border: 1px solid #45423d; border-radius: 10px">
        <dc-import name="ClassIcon" cls="{{c.key}}" size="36" hint-size="36px,36px"></dc-import>
        <span style="flex: 1 1 0; display: flex; flex-direction: column">
          <span style="font-size: 15px; font-weight: 700">{{c.label}}</span>
          <span style="font-size: 12px; color: #a8a49c">{{c.glyph}}</span>
        </span>
        <code style="font-size: 13px; color: #a8a49c">{{c.hex}}</code>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      ['brilliant', 'Brilliant', '!!', '#1baaa6'], ['great', 'Great', '!', '#5b8baf'],
      ['best', 'Best', 'Star', '#98bc49'], ['excellent', 'Excellent', 'Thumbs up', '#98bc49'],
      ['good', 'Good', 'Check', '#9db57a'], ['book', 'Book', 'Book, brown', '#a88764'],
      ['repertoire', 'Repertoire', 'Book, blue', '#3f94e0'], ['inaccuracy', 'Inaccuracy', '?!', '#f4bf44'],
      ['mistake', 'Mistake', '?', '#e28c28'], ['miss', 'Miss', 'Cross', '#ff7769'],
      ['blunder', 'Blunder', '??', '#c93230'], ['forced', 'Forced', 'Arrow', '#96bc4b']
    ].map(([key, label, glyph, hex]) => ({ key, label, glyph, hex }));
    return { items };
  }
}
</script>
</body>
</html>
