<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game over card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="go-title" style="position: relative; width: 340px; box-sizing: border-box; display: flex; flex-direction: column; background: #2b2a27; border: 1px solid #45423d; border-radius: 12px; overflow: hidden; color: #ece9e4; font-family: 'Noto Sans', system-ui, sans-serif; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55)">
  <button aria-label="Copy PGN" title="Copy PGN" style="position: absolute; top: 8px; left: 8px; width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 6px; cursor: pointer">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a8a49c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h2"></path></svg>
  </button>
  <button aria-label="Close" title="Close" style="position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 6px; cursor: pointer">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a8a49c" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </button>
  <div style="padding: 22px 24px 18px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: {{headBg}}">
    <sc-if value="{{notDraw}}" hint-placeholder-val="{{ true }}"><svg width="34" height="34" viewBox="0 0 24 24" fill="{{iconFill}}" aria-hidden="true"><path d="{{iconPath}}"></path></svg></sc-if>
    <sc-if value="{{isDraw}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="height: 34px; display: flex; align-items: center; font-size: 34px; font-weight: 800; line-height: 1; color: #a8a49c">½</span></sc-if>
    <h2 id="go-title" style="margin: 4px 0 0; font-size: 28px; font-weight: 800; line-height: 1.15">{{title}}</h2>
    <p style="margin: 0; font-size: 14px; color: #a8a49c">{{reason}}</p>
  </div>
  <div style="padding: 18px 24px; display: flex; align-items: flex-start; justify-content: center; gap: 18px">
    <div style="width: 96px; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <div style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 10px; background: #7fa650; color: #141412; border: 3px solid {{meRing}}; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800">B</div>
      <span style="font-size: 14px; font-weight: 700">Bruno</span>
    </div>
    <div aria-label="Match score {{meScore}} to {{botScore}}" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
      <span style="font-size: 26px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap">{{meScore}} – {{botScore}}</span>
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #a8a49c">Match</span>
    </div>
    <div style="width: 96px; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <div style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 10px; background: #5a5650; border: 3px solid {{botRing}}; display: flex; align-items: center; justify-content: center">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ece9e4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="6" width="16" height="13" rx="3"></rect><circle cx="9" cy="12" r="1.3"></circle><circle cx="15" cy="12" r="1.3"></circle><path d="M12 6V3"></path></svg>
      </div>
      <span style="font-size: 14px; font-weight: 700">Maia</span>
    </div>
  </div>
  <div style="padding: 0 20px 20px; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #7fa650; color: #141412; border: 0; border-radius: 10px; font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.22)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#141412" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6-4.9-4.6 6.6-.8z"></path></svg>
      Game Review
    </button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="height: 44px; background: #45423d; color: #ece9e4; border: 0; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.22)">New 3+2</button>
      <button style="height: 44px; background: #45423d; color: #ece9e4; border: 0; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.22)">Rematch</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result":{"editor":"enum","options":["won","lost","draw"],"default":"won"},"reason":{"editor":"text","default":"by checkmate"},"meScore":{"editor":"text","default":"2"},"botScore":{"editor":"text","default":"1"},"$preview":{"width":340,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const result = this.props.result ?? 'won';
    const trophy = 'M7 3h10v3h3v2a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.8V17h3v4H8v-4h3v-2.2A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V6h3zM6 8a2 2 0 0 0 1 1.7V8zm12 0v1.7A2 2 0 0 0 18 8z';
    const flag = 'M5 21V4h11l-2 4 2 4H7v9z';
    const v = {
      won: { title: 'You won!', headBg: 'linear-gradient(180deg, rgba(127,166,80,0.32), rgba(127,166,80,0))', iconFill: '#f4bf44', iconPath: trophy, meRing: '#f4bf44', botRing: 'transparent' },
      lost: { title: 'You lost', headBg: 'linear-gradient(180deg, rgba(201,50,48,0.28), rgba(201,50,48,0))', iconFill: '#a8a49c', iconPath: flag, meRing: 'transparent', botRing: '#f4bf44' },
      draw: { title: 'Draw', headBg: 'linear-gradient(180deg, rgba(168,164,156,0.22), rgba(168,164,156,0))', iconFill: '#a8a49c', iconPath: '',meRing: 'transparent', botRing: 'transparent' }
    }[result];
    return { ...v, isDraw: result === 'draw', notDraw: result !== 'draw', meScore: this.props.meScore ?? '2', botScore: this.props.botScore ?? '1', reason: this.props.reason ?? 'by checkmate' };
  }
}
</script>
</body>
</html>
