name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Godot 4.7.2 and matching export template
        run: |
          $downloads = @{
            'Godot_v4.7.2-stable_win64.exe.zip' = '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
            'Godot_v4.7.2-stable_export_templates.tpz' = 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011'
          }
          foreach ($file in $downloads.GetEnumerator()) {
            $path = Join-Path $env:RUNNER_TEMP $file.Key
            Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$($file.Key)" -OutFile $path
            if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $file.Value) {
              throw "SHA-256 mismatch: $($file.Key)"
            }
          }
          Expand-Archive "$env:RUNNER_TEMP/Godot_v4.7.2-stable_win64.exe.zip" "$env:RUNNER_TEMP/godot"
          "GODOT=$env:RUNNER_TEMP/godot/Godot_v4.7.2-stable_win64_console.exe" >> $env:GITHUB_ENV

          $templates = "$env:APPDATA/Godot/export_templates/4.7.2.stable"
          New-Item -ItemType Directory -Force $templates | Out-Null
          $archive = [IO.Compression.ZipFile]::OpenRead("$env:RUNNER_TEMP/Godot_v4.7.2-stable_export_templates.tpz")
          try {
            [IO.Compression.ZipFileExtensions]::ExtractToFile(
              $archive.GetEntry('templates/windows_release_x86_64.exe'), "$templates/windows_release_x86_64.exe")
          } finally {
            $archive.Dispose()
          }

      - name: Preserve raw theme assets
        run: |
          # ThemeLoader reads SVG, JSON and OGG bytes directly, without imported resources.
          Get-ChildItem themes -Recurse -File | Where-Object { $_.Extension -ne '.import' -and -not $_.Name.StartsWith('.') } | ForEach-Object {
            Set-Content -LiteralPath "$($_.FullName).import" -Value "[remap]`nimporter=`"keep`"" -Encoding utf8NoBOM
          }

      - name: Import project
        run: |
          & $env:GODOT --headless --editor --import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export Windows build
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          & $env:GODOT --headless --export-release 'Windows Desktop' build/windows/P-Chess.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch verified engine and Maia networks
        run: ./scripts/fetch-engine.ps1 -Root "$env:GITHUB_WORKSPACE/build/windows"

      - name: Bundle the Visual C++ runtime for Lc0
        run: |
          # lc0.exe imports these; a clean Windows has no VC++ runtime, so they ship app-local.
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -property installationPath
          $redist = Get-ChildItem "$vs/VC/Redist/MSVC" -Directory | Where-Object Name -match '^[\d.]+$' |
            Sort-Object { [version]$_.Name } | Select-Object -Last 1
          if (-not $redist) { throw "No VC++ redist under $vs" }
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'vcomp140.dll') {
            # x64 holds Microsoft.VC14x.CRT (the first three) and Microsoft.VC14x.OpenMP (vcomp140).
            $source = Get-ChildItem "$($redist.FullName)/x64" -Recurse -Filter $dll | Select-Object -First 1
            if (-not $source) { throw "VC++ redist $($redist.Name) is missing $dll" }
            Copy-Item -LiteralPath $source.FullName build/windows/engine/lc0/
            "$dll <- $($source.FullName)"
          }

      - name: Include licences and source links
        run: |
          $licence = 'build/windows/engine/weights/COPYING'
          Invoke-WebRequest https://raw.githubusercontent.com/CSSLab/maia-chess/v1.0/LICENSE -OutFile $licence
          if ((Get-FileHash $licence -Algorithm SHA256).Hash -ne '3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986') {
            throw 'SHA-256 mismatch: Maia COPYING'
          }
          # Godot's MIT licence and engine notices (the export template), and the AGPL text the Enigmahack sounds require.
          New-Item -ItemType Directory -Force build/windows/licenses | Out-Null
          $notices = [ordered]@{
            'Godot-LICENSE.txt'   = @('https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/LICENSE.txt', 'b0435e3b3e4e55238f05f4b306f30524a1b2e20147810d436eaa554fa6855c80')
            'Godot-COPYRIGHT.txt' = @('https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/COPYRIGHT.txt', 'cb1980c88089573bcacd7221d777c689bb8bbd778799f24c27fca0fe5f774d6d')
            'AGPL-3.0.txt'        = @('https://raw.githubusercontent.com/lichess-org/lila/81e2d1bca7a0c97ba3a980f2c51fcff67bfef7ed/LICENSE', '0d96a4ff68ad6d4b6f1f30f713b18d5184912ba8dd389f86aa7710db079abcb0')
          }
          foreach ($notice in $notices.GetEnumerator()) {
            $path = "build/windows/licenses/$($notice.Key)"
            Invoke-WebRequest $notice.Value[0] -OutFile $path
            if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $notice.Value[1]) {
              throw "SHA-256 mismatch: $($notice.Key)"
            }
          }
          Copy-Item docs/THIRD_PARTY.md build/windows/THIRD_PARTY.md

      - name: Verify package and zip
        run: |
          $required = @('P-Chess.exe', 'P-Chess.pck', 'THIRD_PARTY.md', 'engine/lc0/lc0.exe', 'engine/lc0/COPYING', 'engine/weights/COPYING', 'engine/stockfish/stockfish.exe', 'engine/stockfish/Copying.txt')
          $required += 11..19 | ForEach-Object { "engine/weights/maia-$($_ * 100).pb.gz" }
          $required += 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'vcomp140.dll' | ForEach-Object { "engine/lc0/$_" }
          $required += 'Godot-LICENSE.txt', 'Godot-COPYRIGHT.txt', 'AGPL-3.0.txt' | ForEach-Object { "licenses/$_" }
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath "build/windows/$file" -PathType Leaf)) {
              throw "Release package is missing $file"
            }
          }
          Compress-Archive -Path build/windows/* -DestinationPath "$env:RUNNER_TEMP/P-Chess-windows-x86_64.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" "$env:RUNNER_TEMP/P-Chess-windows-x86_64.zip" --verify-tag --title "$env:RELEASE_TAG" --notes-file docs/THIRD_PARTY.md
