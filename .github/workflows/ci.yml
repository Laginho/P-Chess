name: CI

on: push

permissions:
  contents: read

jobs:
  tbprobe-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build the pinned Fathom helper
        run: ./scripts/build-tbprobe.ps1 -Root "$env:RUNNER_TEMP/tbprobe-build"

      - name: Probe from a folder with spaces and accents
        run: |
          $root = "$env:RUNNER_TEMP/P Chess ação"
          New-Item -ItemType Directory -Force "$root/engine/tbprobe", "$root/engine/tablebase" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/tbprobe-build/engine/tbprobe/tbprobe.exe" "$root/engine/tbprobe/"
          # The same pinned KRvK pair as fetch-engine.ps1; this smoke probe needs only this material.
          $files = [ordered]@{
            'KRvK.rtbw' = @('wdl', '386fbde73308e49a4207836922c68b30b664e83c5a37f7fa37305a15cd16f2f1')
            'KRvK.rtbz' = @('dtz', 'cab59f42e75c2a25da3939231850a79fa838593fff5c28d7772da92062ed965a')
          }
          foreach ($file in $files.GetEnumerator()) {
            $path = "$root/engine/tablebase/$($file.Key)"
            Invoke-WebRequest "https://tablebase.lichess.ovh/tables/standard/3-4-5-$($file.Value[0])/$($file.Key)" -OutFile $path
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $file.Value[1]) {
              throw "SHA-256 mismatch: $($file.Key)"
            }
          }
          $start = [Diagnostics.ProcessStartInfo]::new("$root/engine/tbprobe/tbprobe.exe")
          $start.UseShellExecute = $false
          $start.WorkingDirectory = $env:RUNNER_TEMP
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $process = [Diagnostics.Process]::Start($start)
          foreach ($line in @('uci', 'setoption name SyzygyPath value ../tablebase', 'isready',
              'position fen 8/8/8/4k3/8/4K3/8/R7 w - - 0 1', 'go', 'quit')) {
            $process.StandardInput.WriteLine($line)
          }
          $process.StandardInput.Close()
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'tbprobe smoke probe timed out' }
          $output = $process.StandardOutput.ReadToEnd()
          $errors = $process.StandardError.ReadToEnd()
          $output
          if ($process.ExitCode -ne 0 -or $errors -or $output -match '(?m)^(error |info string tberror )' -or
              $output -notmatch '(?m)^info string tbmove [a-h][1-8][a-h][1-8] win [0-9]+\r?$' -or
              $output -notmatch '(?m)^bestmove [a-h][1-8][a-h][1-8]\r?$') {
            throw "tbprobe smoke probe failed (exit $($process.ExitCode)): $errors"
          }

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install -m 755 "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot

      # A fresh checkout has no .godot/imported, and the theme's font is an imported resource.
      - name: Import assets
        run: godot --headless --import

      - name: Run tests
        run: godot --headless -s tests/run.gd

  windows-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Godot 4.7.2 and matching export templates
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install -m 755 "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot

          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/templates.tpz" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/templates.tpz" | sha256sum --check
          unzip -q "$RUNNER_TEMP/templates.tpz" 'templates/windows_release_x86_64.exe' -d "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mv "$RUNNER_TEMP/templates/windows_release_x86_64.exe" \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Preserve raw theme assets
        shell: bash
        run: |
          # ThemeLoader reads SVG, JSON and OGG bytes directly, without imported resources.
          # Set Keep File before the first import; an include filter alone remaps SVG/OGG.
          while IFS= read -r -d '' asset; do
            printf '[remap]\nimporter="keep"\n' > "$asset.import"
          done < <(find themes -type f ! -name '*.import' ! -name '.*' -print0)

      - name: Import project
        run: godot --headless --editor --import

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/P-Chess.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: P-Chess-windows-x86_64
          path: build/windows/
          if-no-files-found: error
